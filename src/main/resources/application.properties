spring.application.name=notion-template-api

# Server Configuration
server.port=${PORT:8080}
# server.servlet.context-path=/api removed to match frontend requests

# Database Configuration
# Neon PostgreSQL as default, with env vars override for segurança/flexibilidade
# Dados fornecidos: postgresql://neondb_owner:npg_rYoG9mhZfy8I@ep-billowing-queen-ahk0ii41-pooler.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://ep-billowing-queen-ahk0ii41-pooler.c-3.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DATABASE_USER:neondb_owner}
spring.datasource.password=${DATABASE_PASSWORD:npg_rYoG9mhZfy8I}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Security Configuration
# Default dev secret so the app starts without env var; override in production.
api.security.token.secret=${JWT_SECRET:32-char-very-secret-key-notion-api-dev}
# Default CORS for dev (localhost) and produção (Vercel),
# mas pode ser sobrescrito por CORS_ALLOWED_ORIGINS em cada ambiente.
api.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://notion-template-indol.vercel.app}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:2}
